apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: teleport-cluster
  namespace: teleport
spec:
  driftDetection:
    mode: enabled
  interval: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: teleport-cluster
      version: 18.11.0
      sourceRef:
        kind: HelmRepository
        name: teleport-charts
        namespace: flux-system
      interval: 5m
  values:
    chartMode: standalone
    clusterName: teleport.internal.wat.sn
    proxyListenerMode: multiplex
    service:
      type: LoadBalancer
    annotations:
      service:
        external-dns.alpha.kubernetes.io/hostname: teleport.internal.wat.sn.
    tls:
      existingSecretName: teleport-tls
    persistence:
      enabled: true
      existingClaimName: teleport-data
    operator:
      enabled: true
