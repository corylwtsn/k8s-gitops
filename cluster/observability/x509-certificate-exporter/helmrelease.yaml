# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: x509-certificate-exporter
  namespace: observability
spec:
  interval: 1h
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: x509-certificate-exporter
      version: 4.2.0
      sourceRef:
        kind: HelmRepository
        name: enix-charts
        namespace: flux-system
      interval: 24h
  values:
    secretsExporter:
      secretTypes:
        - type: kubernetes.io/tls
          key: tls.crt
        # copied etcd client cert used by CoreDNS
        - type: Opaque
          key: server-client.crt
      # CNPG rotates its own certs ~7 days before expiry
      excludeLabels:
        - app.kubernetes.io/managed-by=cloudnative-pg
      excludeNamespaces:
        - cnpg-system
    prometheusRules:
      warningDaysLeft: 14
      criticalDaysLeft: 7
