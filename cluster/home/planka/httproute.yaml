apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: planka
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: network
      sectionName: websecure
  hostnames:
    - planka.wat.sn
    - planka.internal.wat.sn
  rules:
    - backendRefs:
        - name: planka
          port: 1337
