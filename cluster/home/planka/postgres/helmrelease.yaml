---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: planka-postgres
spec:
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: cluster
      version: 0.8.1
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    type: postgresql
    version:
      postgresql: "17"
      mode: standalone

    cluster:
      instances: 2
      storage:
        size: 10Gi
        storageClass: freenas-nfs-csi
      enableSuperuserAccess: false
      enablePDB: true

      plugins:
        - name: barman-cloud.cloudnative-pg.io
          enabled: true
          isWALArchiver: true
          parameters:
            barmanObjectName: planka-postgres-cluster-backups

      monitoring:
        enabled: true
        prometheusRule:
          excludeRules:
            - CNPGClusterHAWarning

      initdb:
        database: planka
        owner: planka

    backups:
      enabled: true
      method: plugin
      pluginConfiguration:
        name: barman-cloud.cloudnative-pg.io
      provider: s3
      retentionPolicy: 14d
      endpointURL: https://s3.us-west-000.backblazeb2.com
      s3:
        bucket: cwnet-postgres-backups
        path: /planka
      secret:
        create: false
        name: cnpg-backups-b2
      scheduledBackups:
        - name: daily
          schedule: "0 40 3 * * *"
          method: plugin
          backupOwnerReference: self
          pluginConfiguration:
            name: barman-cloud.cloudnative-pg.io
