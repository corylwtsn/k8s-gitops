apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app memos-postgresql
spec:
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: cluster
      version:  0.8.1
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    type: postgresql
    version:
      postgresql: "16"
      mode: standalone

    cluster:
      instances: 2
      imageName: "ghcr.io/cloudnative-pg/postgresql:16@sha256:4418a66c2232ba0bd63dd6c7a98ee401bcac340efbb5f380f8879d004654a7d3"
      storage:
        size: 10Gi
        storageClass: "freenas-nfs-csi"
      services:
        disabledDefaultServices: ["ro", "r"]
        additional:
          - selectorType: rw
            serviceTemplate:
              metadata:
                name: "memos-db-lb"
                annotations:
                  external-dns.alpha.kubernetes.io/hostname: db.memos.internal.wat.sn.
              spec:
                type: LoadBalancer
                loadBalancerIP: 192.168.0.6
                ports:
                  - name: postgres
                    port: 5432
                    targetPort: 5432
                    protocol: TCP
      certificates:
        serverCASecret: memos-db-cert
        serverTLSSecret: memos-db-cert
      enableSuperuserAccess: false
      enablePDB: true

      plugins:
        - name: barman-cloud.cloudnative-pg.io
          enabled: true
          isWALArchiver: true
          parameters:
            barmanObjectName: memos-postgresql-cluster-backups

      monitoring:
        enabled: true
        prometheusRule:
          excludeRules:
            - CNPGClusterHAWarning

      initdb:
        database: memos
        secret:
          name: memos-db

    backups:
      enabled: true
      method: plugin
      pluginConfiguration:
        name: barman-cloud.cloudnative-pg.io
      provider: s3
      retentionPolicy: 14d
      endpointURL: https://s3.us-west-000.backblazeb2.com
      s3:
        bucket: cwnet-postgres-backups
        path: /memos
      secret:
        create: false
        name: cnpg-backups-b2
      scheduledBackups:
        - name: daily
          schedule: "0 30 3 * * *"
          method: plugin
          backupOwnerReference: self
          pluginConfiguration:
            name: barman-cloud.cloudnative-pg.io
