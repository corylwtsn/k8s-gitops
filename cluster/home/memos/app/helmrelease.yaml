# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.0.1/charts/other/app-template/values.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app memos
spec:
  driftDetection:
    mode: enabled
  interval: 30m
  dependsOn:
    - name: memos-postgresql
  install:
    remediation:
      retries: 3
  upgrade:
    force: true
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  values:
    controllers:
      main:
        containers:
          app:
            image:
              repository: neosmemo/memos
              tag: 0.30.0@sha256:71a5b4738d1bed96e92112004054f0888e92791b64eb78afd79077c96e6f9327
            env:
              MEMOS_PORT: &apiPort 5230
              MEMOS_DRIVER: postgres
              MEMOS_DSN:
                valueFrom:
                  secretKeyRef:
                    name: memos-db
                    key: memos-dsn

    service:
      main:
        controller: main
        ports:
          http:
            port: *apiPort
    route:
      main:
        kind: HTTPRoute
        hostnames:
          - memos.internal.wat.sn
          - memos.wat.sn
        parentRefs:
          - name: traefik-gateway
            namespace: network
            sectionName: websecure
    persistence:
      resources:
        existingClaim: memos-resources
        advancedMounts:
          main:
            app:
              - path: /var/opt/memos
