apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app mealie
spec:
  driftDetection:
    mode: enabled
  interval: 30m
  dependsOn:
    - name: mealie-postgresql
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  # yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.0.1/charts/other/app-template/values.schema.json
  values:
    controllers:
      main:
        containers:
          app:
            image:
              repository: ghcr.io/mealie-recipes/mealie
              tag: v3.29.0@sha256:78eb28b8776d0bad40c5e605c72b3f4f5976793e491558c7dcbdfc04c835d4bc
              pullPolicy: IfNotPresent
            env:
              DB_ENGINE: postgres
              TZ: America/New_York
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: mealie-db
                    key: password
              POSTGRES_SERVER: db.mealie.internal.wat.sn
              BASE_URL: https://mealie.wat.sn
              OIDC_AUTH_ENABLED: true
              OIDC_REQUIRES_EMAIL_VERIFICATION: false
              OIDC_CONFIGURATION_URL:
                valueFrom:
                  secretKeyRef:
                    name: mealie
                    key: oidc_configuration_url
              OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: mealie
                    key: oidc_client_id
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: mealie
                    key: oidc_client_secret
              OIDC_ADMIN_GROUP: mealie-admins
              # OIDC_USER_GROUP: mealie-users
              OIDC_AUTO_REDIRECT: true
              # OIDC_PROVIDER_NAME: Authnetik
              
    service:
      main:
        controller: main
        ports:
          http:
            port: 9000

    route:
      main:
        kind: HTTPRoute
        hostnames:
          - mealie.internal.wat.sn
          - mealie.wat.sn
        parentRefs:
          - name: traefik-gateway
            namespace: network
            sectionName: websecure

    persistence:
      config:
        type: persistentVolumeClaim
        existingClaim: mealie-data
        advancedMounts:
          main:
            app:
              - path: /app/data
                