---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/clusterexternalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: volsync-claude-code-git
spec:
  externalSecretName: claude-code-git-volsync
  namespaces:
    - agents
  refreshTime: 1h
  externalSecretSpec:
    secretStoreRef:
      kind: ClusterSecretStore
      name: onepassword-connect
    target:
      creationPolicy: Owner
      deletionPolicy: "Delete"
      template:
        engineVersion: v2
        data:
          RESTIC_REPOSITORY: "{{ .repository_template }}/claude-code-git"
          RESTIC_PASSWORD: "{{ .restic_password }}"
          AWS_ACCESS_KEY_ID: "{{ .username }}"
          AWS_SECRET_ACCESS_KEY: "{{ .password }}"
    dataFrom:
      - extract:
          key: volsync-b2
