apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync
spec:
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: volsync
      version: 0.17.0
      sourceRef:
        kind: HelmRepository
        name: backube-charts
        namespace: flux-system
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ServiceMonitor
              name: volsync
            patch: |
              - op: add
                path: /spec/endpoints/0/bearerTokenFile
                value: /var/run/secrets/kubernetes.io/serviceaccount/token
