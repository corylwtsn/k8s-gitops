apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: identity
spec:
  driftDetection:
    mode: enabled
  interval: 5m
  dependsOn:
    - name: authentik-postgres
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: authentik
      version: 2026.8.5
      sourceRef:
        kind: HelmRepository
        name: authentik-charts
        namespace: flux-system
      interval: 5m
  valuesFrom:
    - kind: Secret
      name: authentik-postgres-cluster-app
      valuesKey: username
      targetPath: authentik.postgresql.user
    - kind: Secret
      name: authentik-postgres-cluster-app
      valuesKey: password
      targetPath: authentik.postgresql.password
    - kind: Secret
      name: authentik-secrets
      valuesKey: secretKey
      targetPath: authentik.secret_key
  values:
    global:
      image:
        repository: ghcr.io/goauthentik/server
        tag: 2026.8.5@sha256:602227a86455d6772e3d16b7d852713c4f864f40df5df894abd1285bb53979a5
    authentik:
      postgresql:
        host: authentik-postgres-cluster-rw
        name: authentik
    geoip:
      enabled: false
      existingSecret:
        secretName: authentik-secrets
        accountId: geoipId
        licenseKey: geoipKey
    server:
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
          interval: 30s
      route:
        main:
          enabled: true
          hostnames:
            - auth.internal.wat.sn
            - auth.wat.sn
          parentRefs:
            - name: traefik-gateway
              namespace: network
              sectionName: websecure
    worker:
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
          interval: 30s
