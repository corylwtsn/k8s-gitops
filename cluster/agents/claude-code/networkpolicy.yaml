apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: claude-code
  namespace: agents
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: claude-code
  policyTypes:
    - Ingress
    - Egress
  # No ingress rules at all: Teleport nodes dial OUT to the proxy over a
  # reverse tunnel, so SSH access needs zero inbound ports opened here.
  ingress: []
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    - ports:
        - port: 443
          protocol: TCP
      # Coarse-grained: HTTPS anywhere (Teleport proxy, Anthropic's API,
      # OAuth login, npm registry, executor.sh, etc.). Tighten later if a
      # dedicated egress-control layer gets added.
      to:
        - ipBlock:
            cidr: 0.0.0.0/0
