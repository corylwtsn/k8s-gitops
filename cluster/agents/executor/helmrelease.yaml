---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/app-template-5.0.1/charts/other/app-template/values.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: executor
  namespace: agents
spec:
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    controllers:
      main:
        containers:
          app:
            image:
              repository: ghcr.io/rhyssullivan/executor-selfhost
              tag: 1.5.42
            env:
              EXECUTOR_WEB_BASE_URL: https://executor.internal.wat.sn
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: "1"
                memory: 1Gi
    service:
      main:
        controller: main
        ports:
          http:
            port: 4788
    route:
      main:
        kind: HTTPRoute
        hostnames:
          - executor.internal.wat.sn
        parentRefs:
          - name: traefik-gateway
            namespace: network
            sectionName: websecure
    persistence:
      data:
        existingClaim: executor-data
        globalMounts:
          - path: /data
