---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
  namespace: internal
spec:
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: node-feature-discovery
      version: 0.20.0
      sourceRef:
        kind: HelmRepository
        name: nfd-charts
        namespace: flux-system
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    image:
      repository: gcr.io/k8s-staging-nfd/node-feature-discovery
      tag: v0.20.0@sha256:3f600513a463712aaab33cf525e20be0b5718e57da50d0ac2e092b86bcfc4812
    worker:
      config:
        core:
          labelSources:
            - pci
            - usb